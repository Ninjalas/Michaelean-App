name: michaelean_app
description: "Michaelean — campus-life app for Saint Michael's College of Laguna (frontend prototype)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  excel_plus: ^2.29.1
  flutter:
    sdk: flutter
  go_router: ^18.1.0
  image_picker: ^1.2.4
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # List assets file by file. Never list assets/images/ as a folder:
  # it holds the Luma reference screenshots, which must not ship.
  assets:
    - assets/images/SMCL_Emblem.png
    - assets/images/SMCL_MAP.png
    - assets/images/profiles/nicolas.jpg
    - assets/images/profiles/css_profile.jpg
    - assets/images/profiles/css_coverpage.png
    - assets/images/profiles/Sir_Georgio.png
    - assets/images/events/css_commitevent.jpg
    - assets/images/events/css_startupevent.jpg
    - assets/images/events/css_unpackingevent.jpg
    # School News: real posts from SMCL's Facebook page (mock_home.dart).
    - assets/images/news/hackathon_angelic_innovators.jpg
    - assets/images/news/limaco_keynote_speaker.jpg
    - assets/images/news/limaco_paper_presentation.jpg
    - assets/images/news/michaelmas_2026.jpg
    - assets/images/news/pitlc_baguio.jpg
    - assets/images/news/psychometricians_100.jpg
    - assets/images/news/psychometricians_just_in.jpg
    - assets/images/news/volleyball_archangels.jpg
    # Department news: real posts from the Computer Science Society's page.
    - assets/images/dcs/dcs_innovation_contest_1.jpg
    - assets/images/dcs/dcs_innovation_contest_2.jpg
    - assets/images/dcs/dcs_innovation_contest_3.jpg
    - assets/images/dcs/dcs_innovation_contest_4.jpg
    - assets/images/dcs/dcs_lyca_mscs.jpg
    - assets/images/dcs/hackathon_byjc_1.jpg
    - assets/images/dcs/hackathon_byjc_2.jpg
    - assets/images/dcs/hackathon_byjc_3.jpg
    - assets/images/dcs/hackathon_byjc_4.jpg
    - assets/images/dcs/huefest_2026.jpg
    - assets/fonts/Inter-OFL.txt # shown in About › Open-source licenses

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Large titles only (spec §2.3). Same OFL license as Inter (Inter-OFL.txt).
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
